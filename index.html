<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download your certificate · Internal Smart India Hackathon 2026</title>
  <meta name="description" content="Enter your name and SAP ID to download your Internal Smart India Hackathon 2026 certificate.">
  <link rel="icon" href="assets/open-logo.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="top">
    <img class="partners" src="assets/partners-strip.png" alt="UPES, Ministry of Education, AICTE, MoE's Innovation Cell, Smart India Hackathon 2026">
  </header>

  <main>
    <section id="formView" class="hero">
      <p class="eyebrow">Certificate of Participation</p>
      <h1><span>Internal</span> <span class="saf">Smart</span> <span>India</span> <span class="grn">Hackathon</span> <span>2026</span></h1>
      <p class="lede">Enter your name and SAP ID exactly as you registered. Your certificate is generated right here in your browser — nothing is uploaded.</p>

      <form id="form" class="card" novalidate>
        <label for="name">Full name</label>
        <input id="name" name="name" autocomplete="name" placeholder="As registered with the college" maxlength="100" required>
        <label for="sap">SAP ID</label>
        <input id="sap" name="sap" inputmode="numeric" autocomplete="off" placeholder="e.g. 590012345" maxlength="20" required>
        <p id="error" class="error" role="alert" hidden></p>
        <button id="go" class="btn" type="submit" disabled>Loading…</button>
        <p class="hint" id="help"></p>
      </form>
    </section>

    <section id="resultView" class="result" hidden>
      <p class="eyebrow ok">✓ Details verified</p>
      <h2>Your certificate is ready</h2>
      <div class="frame"><canvas id="cert" aria-label="Your certificate preview"></canvas></div>
      <div class="actions">
        <button id="pdf" class="btn">Download PDF</button>
        <button id="png" class="btn ghost">Download image (PNG)</button>
        <button id="back" class="btn link">← Not you? Start over</button>
      </div>
    </section>
  </main>

  <footer>
    <span>Organised by</span>
    <img class="open" src="assets/open-logo.png" alt="UPES Open Community">
  </footer>

  <script src="vendor/jspdf.umd.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
